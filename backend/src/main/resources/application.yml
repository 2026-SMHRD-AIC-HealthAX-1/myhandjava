server:
  port: 8080

spring:
  application:
    name: hometraining-api
  profiles:
    active: mysql
  # application-secrets.yml은 .gitignore에 올려서 커밋되지 않는다 — 카카오/구글 OAuth 키처럼
  # 공개 저장소에 올리면 안 되는 값은 여기 대신 그 파일(로컬에만 존재)에 실제 값을 넣어둔다.
  # 파일이 없는 환경(팀원 PC, 배포 서버)에서는 optional:이라 조용히 무시되고 아래 환경변수
  # 기본값(빈 문자열)이 그대로 쓰여 소셜 로그인만 비활성 상태가 된다.
  config:
    import: optional:classpath:application-secrets.yml

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-32bytes-min}
    access-token-minutes: 60
    refresh-token-days: 14
  cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://m8zvvvvx-5500.jpe1.devtunnels.ms}
  oauth:
    kakao:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      redirect-uri: ${KAKAO_REDIRECT_URI:https://m8zvvvvx-5500.jpe1.devtunnels.ms/index.html}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://m8zvvvvx-5500.jpe1.devtunnels.ms/index.html}

