spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:project-db-campus.smhrd.com}:${DB_PORT:3312}/${DB_NAME:cd_26K_HI1_p2_3}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # DB 스키마는 담당자가 직접 관리하며, 애플리케이션은 자동 생성/변경하지 않습니다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

